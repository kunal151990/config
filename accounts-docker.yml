spring:
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      
    consumer:
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.finance.app.accounts.dto
        spring.json.value.default.type: com.finance.app.accounts.dto.CreditCardBillPaidEvent

  datasource:
    url: jdbc:mysql://accountsdb:3306/accountsdb
    username: root
    password: root

  jpa:
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/finance
          jwk-set-uri: http://keycloak:8080/realms/finance/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8070/eureka/

keycloak:
  server-url: http://keycloak:8080
