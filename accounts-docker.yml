spring:
  datasource:
    url: jdbc:mysql://accountsdb:3306/accountsdb
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/finance
          jwk-set-uri: http://keycloak:8080/realms/finance/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8070/eureka/

keycloak:
  server-url: http://keycloak:8080
