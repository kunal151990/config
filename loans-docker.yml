spring:
  datasource:
    url: jdbc:mysql://loansdb:3306/loans
    username: root
    password: :root

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/finance
          jwk-set-uri: http://keycloak:8080/realms/finance/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8070/eureka/
