spring:
  datasource:
    url: jdbc:mysql://localhost:3000/accounts
    username: root
    password: root

  jpa:
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/finance

  cloud:
    stream:
      kafka:
        binder:
          brokers:
            - localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka/

keycloak:
  server-url: http://localhost:8180
